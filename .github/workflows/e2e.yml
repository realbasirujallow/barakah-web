name: E2E (Playwright)

# Read-only public-page and API-health smoke checks against production.
# No reviewer credentials, signups, authenticated mutations, or persona writes.
# See docs/testing-safety.md for isolated authenticated testing.
#
# The workflow runs:
#   - on every PR that touches src/, e2e/, or this workflow file
#   - nightly at 08:14 UTC (off the hour to avoid the cron-stampede minute)
#   - on demand via "Run workflow" in the Actions tab
#
# All jobs hit https://trybarakah.com (production). Override with the
# `target_url` workflow_dispatch input if you want to point at a staging URL.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
      - 'playwright.config.ts'
      - 'package*.json'
  schedule:
    # Nightly. Pick a quiet minute to avoid hitting the API at the same instant
    # as every other repo on the planet.
    - cron: '14 8 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Override base URL (default https://trybarakah.com)'
        required: false
        default: 'https://trybarakah.com'
      readiness_url:
        description: 'Dependency-aware backend health URL (set this too when targeting staging)'
        required: false
        default: 'https://api.trybarakah.com/actuator/health'

jobs:
  playwright:
    name: Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Restrict production traffic from pull requests to this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run read-only production smoke tests
        env:
          E2E_BASE_URL: ${{ inputs.target_url || 'https://trybarakah.com' }}
          E2E_API_URL:  ${{ inputs.target_url || 'https://trybarakah.com' }}
          E2E_READINESS_URL: ${{ inputs.readiness_url || 'https://api.trybarakah.com/actuator/health' }}
        run: npx playwright test e2e/public-pages.spec.ts e2e/api-health.spec.ts --project=chromium --project=mobile-chrome --grep-invert @mutation --reporter=list,json

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
